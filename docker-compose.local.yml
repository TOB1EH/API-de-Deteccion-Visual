version: '3.9'

services:
  # PostgreSQL con pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: api_detection_db_local
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./volumes/pg_data_local:/var/lib/postgresql/data
      # Script de inicialización de la BD
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - api-detection-net-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detections_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS Master
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_master_local
    command: master -ip=seaweed-master -port=9333
    ports:
      - "9333:9333"
    volumes:
      - ./volumes/seaweed_master_local:/data
    networks:
      - api-detection-net-local

  # SeaweedFS Volume
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_volume_local
    # En desarrollo a veces 8080 está ocupado, lo exponemos al host en otro puerto (ej 8090)
    # pero internamente sigue en 8080
    command: volume -ip=seaweed-volume -port=8080 -master=seaweed-master:9333
    ports:
      - "8090:8080" # Exponemos al host en 8090 por si 8080 está ocupado
    volumes:
      - ./volumes/seaweed_volume_local:/data
    depends_on:
      - seaweed-master
    networks:
      - api-detection-net-local

  # Frontend (Vue + Vuetify)
  frontend:
    build: ./frontend
    container_name: api_detection_frontend_local
    ports:
      - "3000:80"
    networks:
      - api-detection-net-local
    restart: unless-stopped

  # Nginx (reverse proxy local HTTP)
  nginx:
    image: nginx:1.31.1
    container_name: api_detection_nginx_local
    ports:
      - "80:80"    # Solo HTTP para local
    volumes:
      # Montamos la config local sin HTTPS
      - ./docker/nginx.local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - db
      - seaweed-master
      - seaweed-volume
      - pgadmin
      - api
      - frontend
      - keycloak
    networks:
      - api-detection-net-local
    restart: unless-stopped

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_detection_pgadmin_local
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - api-detection-net-local
    depends_on:
      - db
    restart: unless-stopped

  # Inference Server (YOLO + DeepFace) - orquestado por la API
  inference-server:
    image: tfunes/inference-server:latest
    container_name: yolo_inference_server_local
    environment:
      # URL de la API para que el inference-server pueda persistir datos faciales
      API_URL: http://api:8000
      DEEPFACE_BACKEND: Facenet
    volumes:
      # Modelos YOLO montados en la ruta que espera inference-server
      - ./models/local:/app/models:ro
      # Pesos de DeepFace para reconocimiento facial
      - face_weights_local:/root/.deepface/weights
    networks:
      - api-detection-net-local
  # Keycloak (Autenticacion y Autorizacion)
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: api_detection_keycloak_local
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # KC_HOSTNAME define el hostname que Keycloak usa para generar URLs
      KC_HOSTNAME: localhost
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - db
    networks:
      - api-detection-net-local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/realms/api-detection"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # API REST
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_detection_api_local
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SEAWEED_URL: http://seaweed-volume:8080
      SEAWEED_PUBLIC_URL: http://localhost:8090
      # URL del inference-server para inferencia interna (orquestador)
      INFERENCE_SERVER_URL: http://inference-server:8000
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-api-detection}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://localhost
    volumes:
      - ./models/local:/app/models/local:ro
      - ./client:/app/client:ro
      - ./src:/app/src
    depends_on:
      - db
      - seaweed-volume
      - inference-server
    networks:
      - api-detection-net-local
    restart: unless-stopped

  # InfluxDB (almacenamiento de metricas)
  influxdb:
    image: influxdb:2.8
    container_name: api_detection_influxdb_local
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin123}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-soa}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-30d}
    volumes:
      - influxdb2_data:/var/lib/influxdb2
      - influxdb2_config:/etc/influxdb2
    networks:
      - api-detection-net-local
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086", "--skip-verify"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Telegraf (recoleccion de metricas)
  telegraf:
    image: telegraf:1.38
    container_name: api_detection_telegraf_local
    hostname: "${HOSTNAME:-api-detection-local}"
    volumes:
      - ./docker/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-soa}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
    depends_on:
      influxdb:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - api-detection-net-local
    restart: unless-stopped

  # Grafana (visualizacion y alertas)
  grafana:
    image: grafana/grafana:latest
    container_name: api_detection_grafana_local
    environment:
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3001:3000"
    depends_on:
      - influxdb
    networks:
      - api-detection-net-local
    restart: unless-stopped

networks:
  api-detection-net-local:
    driver: bridge

# Volúmenes
volumes:
  pg_data_local:
  seaweed_master_local:
  seaweed_volume_local:
  face_models_weights:
  influxdb2_data:
  influxdb2_config:
  grafana_data:
  face_weights_local:

