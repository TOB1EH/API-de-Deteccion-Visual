user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events {
    worker_connections 1024;
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # Upstream para futura API (puerto 8000)
    upstream api_backend {
        server localhost:8000;
    }
    # Upstream para SeaweedFS (puerto 8080)
    upstream seaweed_backend {
        server seaweed-volume:8080;
    }
    server {
        listen 80;
        server_name _;
        # Health check
        location / {
            return 200 "API Detection Service OK\n";
            add_header Content-Type text/plain;
        }
        # Proxy a SeaweedFS (futuro)
        location /seaweed/ {
            proxy_pass http://seaweed_backend/;
        }
        # Proxy a API backend (futuro, cuando esté en puerto 8000)
        # location /api/ {
        #     proxy_pass http://api_backend/;
        # }
    }
}