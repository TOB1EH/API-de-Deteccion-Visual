# Configuracion Global
user nginx;                                 # Usuario que ejecuta el proceso Nginx
worker_processes auto;                      # Número de procesos worker (auto = número de CPUs)
error_log /var/log/nginx/error.log warn;    # Archivo de errores
pid /var/run/nginx.pid;                     # Archivo PID del proceso

# Eventos
events {
    worker_connections 1024;              # Número máximo de conexiones por worker
}
http {
    # Importar tipos MIME (define qué es .jpg, .css, .js, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Formato de logs: IP usuario [hora] "solicitud" estado bytes referrer user-agent
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Optimizaciones
    sendfile on;                    # Enviar archivos eficientemente (kernel-level)
    tcp_nopush on;                  # Enviar headers completos antes de datos
    tcp_nodelay on;                 # No esperar más datos antes de enviar (baja latencia)
    keepalive_timeout 65;           # Mantener conexión abierta 65 segundos
    types_hash_max_size 2048;       # Tamaño de tabla hash para tipos MIME

    # Resolver DNS de Docker para resolución dinámica de hostnames
    resolver 127.0.0.11 valid=10s;

    # Upstream para API backend (puerto 8000)
    upstream api_backend {
        server api:8000;
    }
    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name bfts2026.mooo.com;
        return 301 https://$server_name$request_uri;
    }
    # HTTPS - Servidor principal
    server {
        listen 443 ssl http2;
        server_name bfts2026.mooo.com;
        # Certificados SSL
        ssl_certificate /etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem;
        # Configuración SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        # Health check (Health check ligero: responde aunque la API esté caída)
        location = /nginx-health {
            return 200 "API Detection Service OK\n";
            add_header Content-Type text/plain;
        }

        # Página principal con instrucciones de instalacion
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # API REST (Fase 2 en adelante, puerto 8000)
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Keycloak (Autenticacion)
        location /auth/ {
            proxy_pass http://keycloak:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # pgAdmin (gestión PostgreSQL)
        location /pgadmin/ {
            proxy_pass http://pgadmin:80/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
        }
        # SeaweedFS Volume (almacenamiento de objetos)
        location /seaweed/ {
            rewrite ^/seaweed/(.*)$ /$1 break;
            proxy_pass http://seaweed-volume:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # SeaweedFS Master (estado, monitoreo)
        location /seaweed-master/ {
            proxy_pass http://seaweed-master:9333/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /face/ {
            proxy_pass http://inference-server:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
