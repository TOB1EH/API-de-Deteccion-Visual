# Configuracion Global
user nginx;                                 # Usuario que ejecuta el proceso Nginx
worker_processes auto;                      # Número de procesos worker (auto = número de CPUs)
error_log /var/log/nginx/error.log warn;    # Archivo de errores
pid /var/run/nginx.pid;                     # Archivo PID del proceso

# Eventos
events {
    worker_connections 1024;              # Número máximo de conexiones por worker
}
http {
    # Importar tipos MIME (define qué es .jpg, .css, .js, etc.)
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Formato de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Optimizaciones
    sendfile on;                    # Enviar archivos eficientemente (kernel-level)
    tcp_nopush on;                  # Enviar headers completos antes de datos
    tcp_nodelay on;                 # No esperar más datos antes de enviar (baja latencia)
    keepalive_timeout 65;           # Mantener conexión abierta 65 segundos
    types_hash_max_size 2048;       # Tamaño de tabla hash para tipos MIME

    # Resolver DNS de Docker para resolución dinámica de hostnames
    resolver 127.0.0.11 valid=10s;

    # NOTA: No se usan upstream blocks porque nginx resuelve hostnames al
    # arrancar y falla si el servicio aun no esta listo. En su lugar se usan
    # variables en proxy_pass con el resolver 127.0.0.11 para resolucion
    # dinamica.

    # HTTP - Servidor local
    server {
        listen 80;
        server_name localhost;

        # Health check
        location = /nginx-health {
            return 200 "API Detection Service OK (Local)\n";
            add_header Content-Type text/plain;
        }

        # Pagina principal - Frontend SPA (Vue + Vuetify)
        location / {
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Face Recognition endpoints (comentados, requieren face-api corriendo)
        # location ~ ^/api/persons/[^/]+/embeddings$ {
        #     proxy_pass http://face_api_backend;
        #     ...
        # }
        # location ~ ^/api/face-recognition$ {
        #     proxy_pass http://face_api_backend;
        #     ...
        # }

        # API REST (Fase 2 en adelante, puerto 8000)
        location /api/ {
            set $upstream_api http://api:8000;
            proxy_pass $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak (Autenticacion)
        location /auth/ {
            set $upstream_keycloak http://keycloak:8080;
            proxy_pass $upstream_keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # pgAdmin (gestión PostgreSQL)
        location /pgadmin/ {
            set $upstream_pgadmin http://pgadmin:80;
            rewrite ^/pgadmin(/.*)$ $1 break;
            proxy_pass $upstream_pgadmin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /pgadmin;
        }

        # Grafana (monitoreo)
        # serve_from_sub_path=true en Grafana, pasamos el path completo
        location /grafana/ {
            set $upstream_grafana http://grafana:3000;
            proxy_pass $upstream_grafana$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SeaweedFS Volume (almacenamiento de objetos)
        location /seaweed/ {
            set $upstream_seaweed http://seaweed-volume:8080;
            rewrite ^/seaweed/(.*)$ /$1 break;
            proxy_pass $upstream_seaweed;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SeaweedFS Master (estado, monitoreo)
        location /seaweed-master/ {
            set $upstream_seaweed_master http://seaweed-master:9333;
            rewrite ^/seaweed-master(/.*)$ $1 break;
            proxy_pass $upstream_seaweed_master;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
