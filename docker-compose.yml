services:
  # PostgreSQL con pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: api_detection_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./volumes/pg_data:/var/lib/postgresql/data
    networks:
      - api-detection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detections_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS Master
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_master
    command: master -ip=seaweed-master -port=9333
    ports:
      - "9333:9333"
    volumes:
      - ./volumes/seaweed_master:/data
    networks:
      - api-detection-net

  # SeaweedFS Volume
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_volume
    command: volume -ip=seaweed-volume -port=8080 -master=seaweed-master:9333
    ports:
      - "8080:8080"
    volumes:
      - ./volumes/seaweed_volume:/data
    depends_on:
      - seaweed-master
    networks:
      - api-detection-net

  # Nginx (reverse proxy con HTTPS)
  nginx:
    image: nginx:1.31.1
    container_name: api_detection_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:/etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:ro
      - /etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:/etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:ro
    depends_on:
      - db
      - seaweed-master
      - seaweed-volume
      - pgadmin
    networks:
      - api-detection-net
    restart: unless-stopped

  # pgAdmin (gestión PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_detection_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - api-detection-net
    depends_on:
      - db
    restart: unless-stopped

networks:
  api-detection-net:
    driver: bridge