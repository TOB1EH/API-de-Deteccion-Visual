version: '3.9'

services:
  # PostgreSQL con pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: api_detection_db
    environment:
      # Variables de configuración inicial de la BD
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Volumen persistente: datos de BD sobreviven reinicios
      - ./volumes/pg_data:/var/lib/postgresql/data
      # Script de inicialización de la BD
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      # Red privada Docker para comunicación interna entre servicios
      - api-detection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detections_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS Master: coordinador central del sistema de almacenamiento
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_master
    command: master -ip=seaweed-master -port=9333  # Modo master, escucha en puerto 9333
    ports:
      - "9333:9333"
    volumes:
      # Volumen persistente: metadatos del master sobreviven reinicios
      - ./volumes/seaweed_master:/data
    networks:
      - api-detection-net

  # SeaweedFS Volume: servidor de almacenamiento de objteos
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_volume
    # Modo volume, conecta al master, escucha en puerto 8080
    command: volume -ip=seaweed-volume -port=8080 -master=seaweed-master:9333
    ports:
      - "8080:8080"
    volumes:
      # Volumen persistente: archivos almacenados sobreviven reinicios
      - ./volumes/seaweed_volume:/data
    depends_on:
      - seaweed-master
    networks:
      - api-detection-net

  # Frontend (Vue + Vuetify)
  frontend:
    build: ./frontend
    container_name: api_detection_frontend
    ports:
      - "3000:80"
    networks:
      - api-detection-net
    restart: unless-stopped

# Nginx (reverse proxy con HTTPS)
  nginx:
    image: nginx:1.31.1
    container_name: api_detection_nginx
    ports:
      - "80:80"                                    # HTTP (redirige a HTTPS)
      - "443:443"                                  # HTTPS (puerto seguro público)
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados SSL (Let's Encrypt) - solo lectura (ro) - Maquina Virtual Remota
      - /etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:/etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:ro
      - /etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:/etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:ro
    depends_on:
      - db
      - seaweed-master
      - seaweed-volume
      - pgadmin
      - api
      - frontend
      - keycloak
      - grafana
    networks:
      - api-detection-net
    restart: unless-stopped

  # pgAdmin (gestión PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_detection_pgadmin
    environment:
      # Credenciales iniciales para acceder a pgAdmin
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - api-detection-net
    depends_on:
      - db
    restart: unless-stopped

  # Inference Server (YOLO + DeepFace) - orquestado por la API
  inference-server:
    image: tfunes/inference-server:latest
    container_name: yolo_inference_server
    environment:
      # URL de la API para que el inference-server pueda persistir datos faciales
      # En VM usa http://api:8000 (red interna Docker)
      # En local usar: API_URL=https://bfts2026.mooo.com en .env
      API_URL: ${API_URL:-http://api:8000}
      DEEPFACE_BACKEND: Facenet
    volumes:
      # Modelos YOLO montados en la ruta que espera inference-server
      - ./models/local:/app/models:ro
      # Pesos de DeepFace para reconocimiento facial
      - face_weights:/root/.deepface/weights
    networks:
      - api-detection-net
  # Keycloak (Autenticacion y Autorizacion)
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: api_detection_keycloak
    command: start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: bfts2026.mooo.com
      KC_HTTP_PORT: 8080
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - db
    networks:
      - api-detection-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/auth/realms/api-detection"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # API REST
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_detection_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SEAWEED_URL: http://seaweed-volume:8080
      SEAWEED_PUBLIC_URL: https://bfts2026.mooo.com/seaweed
      # URL del inference-server para inferencia interna (orquestador)
      INFERENCE_SERVER_URL: http://inference-server:8000
      FACIAL_JWT_SECRET: ${FACIAL_JWT_SECRET:-cambiar-en-produccion-clave-secreta-2026}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-api-detection}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    volumes:
      - ./models/local:/app/models/local:ro
      - ./client:/app/client:ro
      - ./src:/app/src
    depends_on:
      - db
      - seaweed-volume
      - inference-server
    networks:
      - api-detection-net
    restart: unless-stopped

  # InfluxDB (almacenamiento de metricas)
  influxdb:
    image: influxdb:2.8
    container_name: api_detection_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin123}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-soa}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-metrics}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-30d}
    volumes:
      - influxdb2_data:/var/lib/influxdb2
      - influxdb2_config:/etc/influxdb2
    networks:
      - api-detection-net
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://localhost:8086", "--skip-verify"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Telegraf (recoleccion de metricas)
  telegraf:
    image: telegraf:1.38
    container_name: api_detection_telegraf
    hostname: "${HOSTNAME:-bfts2026.mooo.com}"
    volumes:
      - ./docker/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-soa}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-metrics}
    depends_on:
      influxdb:
        condition: service_healthy
      api:
        condition: service_started
    networks:
      - api-detection-net
    restart: unless-stopped

  # Grafana (visualizacion y alertas)
  grafana:
    image: grafana/grafana:latest
    container_name: api_detection_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_SERVER_ROOT_URL: https://bfts2026.mooo.com/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: bfts2026.mooo.com
      GF_SERVER_ENABLE_GZIP: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-soa-token}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - influxdb
    networks:
      - api-detection-net
    restart: unless-stopped

# Redes
networks:
  api-detection-net:
    driver: bridge

# VOLUMENES
volumes:
  pg_data:
  seaweed_master:
  seaweed_volume:
  influxdb2_data:
  influxdb2_config:
  grafana_data:
  face_weights:
