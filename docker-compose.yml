version: '3.9'

services:
  # PostgreSQL con pgvector
  db:
    image: pgvector/pgvector:pg16
    container_name: api_detection_db
    environment:
      # Variables de configuración inicial de la BD
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # Volumen persistente: datos de BD sobreviven reinicios
      - ./volumes/pg_data:/var/lib/postgresql/data
      # Script de inicialización de la BD
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      # Red privada Docker para comunicación interna entre servicios
      - api-detection-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detections_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS Master: coordinador central del sistema de almacenamiento
  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_master
    command: master -ip=seaweed-master -port=9333  # Modo master, escucha en puerto 9333
    ports:
      - "9333:9333"
    volumes:
      # Volumen persistente: metadatos del master sobreviven reinicios
      - ./volumes/seaweed_master:/data
    networks:
      - api-detection-net

  # SeaweedFS Volume: servidor de almacenamiento de objteos
  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweed_volume
    # Modo volume, conecta al master, escucha en puerto 8080
    command: volume -ip=seaweed-volume -port=8080 -master=seaweed-master:9333
    ports:
      - "8080:8080"
    volumes:
      # Volumen persistente: archivos almacenados sobreviven reinicios
      - ./volumes/seaweed_volume:/data
    depends_on:
      - seaweed-master
    networks:
      - api-detection-net

  # Nginx (reverse proxy con HTTPS)
  nginx:
    image: nginx:1.31.1
    container_name: api_detection_nginx
    ports:
      - "80:80"                                    # HTTP (redirige a HTTPS)
      - "443:443"                                  # HTTPS (puerto seguro público)
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificados SSL (Let's Encrypt) - solo lectura (ro) - Maquina Virtual Remota
      - /etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:/etc/letsencrypt/live/bfts2026.mooo.com/fullchain.pem:ro
      - /etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:/etc/letsencrypt/live/bfts2026.mooo.com/privkey.pem:ro
    depends_on:
      - db
      - seaweed-master
      - seaweed-volume
      - pgadmin
      - api
    networks:
      - api-detection-net
    restart: unless-stopped

  # pgAdmin (gestión PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: api_detection_pgadmin
    environment:
      # Credenciales iniciales para acceder a pgAdmin
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    networks:
      - api-detection-net
    depends_on:
      - db
    restart: unless-stopped

  # API REST
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api_detection_api
    ports:
      - "8000:8000"
    environment:
      # Conexión a PostgreSQL (desde dentro de Docker: nombre del container)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Conexión a SeaweedFS (desde dentro de Docker: nombre del container)
      SEAWEED_URL: http://seaweed-volume:8080
      # URL pública para acceder a imágenes (desde cliente externo)
      SEAWEED_PUBLIC_URL: https://bfts2026.mooo.com/seaweed
    volumes:
      # Montar carpeta de modelos (solo lectura)
      - ./models/local:/app/models/local:ro
      # Montar código (para live reload en desarrollo)
      - ./src:/app/src
    depends_on:
      - db
      - seaweed-volume
    networks:
      - api-detection-net
    restart: unless-stopped

# Redes
networks:
  api-detection-net:
    driver: bridge

# VOLUMENES
volumes:
  pg_data:
  seaweed_master:
  seaweed_volume: