# Configuracion de Nginx para servir la SPA de Vue
# Las rutas del frontend (/, /login, /cargar, etc.) redirigen todas a index.html
# para que vue-router maneje la navegacion del lado del cliente.

server {
    # Escucha en el puerto 80
    listen 80;
    server_name _;

    # Aumentar buffers para URIs largas (Keycloak PKCE)
    large_client_header_buffers 4 32k;

    # Directorio raiz donde estan los archivos estaticos
    root /usr/share/nginx/html;
    index index.html;

    # Comprime los archivos antes de enviarlos al cliente
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Para todas las rutas, intenta servir el archivo directamente.
    # Si no existe (ej: /cargar, /buscar, /frame/xxx), sirve index.html
    # para que vue-router resuelva la ruta del lado del cliente.
    location / {
        try_files $uri $uri/ /index.html;

        # Cachea archivos estaticos con hash en el nombre por 1 año
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy inverso para las API del backend (opcional, para desarrollo)
    # Descomentar cuando el backend este en el mismo servidor:
    # location /api/ {
    #     proxy_pass http://api:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    # Proxy para Keycloak (autenticacion OAuth2)
    # Keycloak genera URLs con http://localhost:3000/auth/...
    # por lo que el frontend nginx debe redirigir al Keycloak real.
    location /auth/ {
        proxy_pass http://keycloak:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
